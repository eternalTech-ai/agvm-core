name: public-core

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  public-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agvm_cockpit_prototype/package-lock.json

      - name: Install API dependencies
        run: |
          python -m pip install -r agvm_api/requirements.txt
          python -m pip install httpx2==2.12.0 pytest reuse

      - name: Compile public Python entrypoints
        run: |
          python -m py_compile \
            agvm_api/core_api_app.py \
            agvm_api/core_browser_security.py \
            agvm_api/core_runtime_router.py \
            agvm_api/core_brain_router.py \
            agvm_api/core_mcp_contract_router.py \
            agvm_api/core_license_router.py \
            agvm_api/module_manifest_contracts.py \
            agvm_api/module_hardening.py \
            agvm_mcp_server/server.py \
            scripts/agvm_module_supervisor.py

      - name: Install UI dependencies
        working-directory: agvm_cockpit_prototype
        run: npm ci

      - name: Build public core UI
        working-directory: agvm_cockpit_prototype
        run: npm run build
        env:
          VITE_AGVM_UI_SHELL_PROFILE: public_core
          VITE_API_URL: http://localhost:8010

      - name: Validate Docker Compose
        run: docker compose config

      - name: Validate SPDX and REUSE coverage
        run: python -m reuse lint

      - name: Run public contract tests
        run: python -m pytest -q

      - name: Scan the exported source boundary
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          forbidden_roots = {"platform", "infra", "terraform", ".aws"}
          forbidden_suffixes = {".db", ".duckdb", ".sqlite", ".sqlite3"}
          local_path = re.compile(r"(?:[A-Za-z]:\\Users\\|[A-Za-z]:/Users/)", re.IGNORECASE)
          violations = []
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8").split("\0")
          for relative in tracked:
              if not relative:
                  continue
              path = root / relative
              if not path.is_file():
                  continue
              if relative.split("/", 1)[0] in forbidden_roots:
                  violations.append(f"forbidden product root: {relative}")
              if path.suffix.lower() in forbidden_suffixes:
                  violations.append(f"runtime database: {relative}")
              if path.name.startswith(".env") and path.name != ".env.example":
                  violations.append(f"private environment file: {relative}")
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              proprietary_marker = "LicenseRef-Eternal-Tech-" + "Proprietary"
              if proprietary_marker in text:
                  violations.append(f"proprietary license marker: {relative}")
              if local_path.search(text):
                  violations.append(f"local machine path: {relative}")
          if violations:
              raise SystemExit("\n".join(sorted(set(violations))))
          print("Public source boundary: PASS")
          PY

      - name: Scan committed content for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --exit-code=1 --log-opts=--all

      - name: Scan committed content with TruffleHog
        run: |
          mkdir -p "$RUNNER_TEMP/trufflehog-tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/trufflehog-tree"
          if ! docker run --rm \
            -v "$RUNNER_TEMP/trufflehog-tree:/src:ro" \
            trufflesecurity/trufflehog:3.95.6@sha256:96f8429082cb2d4ae73b1096dcdb2f5aa139881d97042b0c5e5fa226a392e056 \
            filesystem /src --json --no-update --fail \
            >"$RUNNER_TEMP/trufflehog.jsonl"; then
            echo "TruffleHog detected secret material; output is withheld from CI logs." >&2
            exit 1
          fi

      - name: Build and smoke Docker Core
        run: |
          docker compose build
          docker compose up -d agvm_core_api agvm_core_ui
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8010/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:3020/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Stop Docker Core
        if: always()
        run: docker compose down --volumes --remove-orphans
