name: public-core

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  public-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agvm_cockpit_prototype/package-lock.json

      - name: Install API dependencies
        run: |
          python -m pip install -r agvm_api/requirements.txt
          python -m pip install pytest reuse

      - name: Compile public Python entrypoints
        run: |
          python -m py_compile \
            agvm_api/core_api_app.py \
            agvm_api/core_runtime_router.py \
            agvm_api/core_brain_router.py \
            agvm_api/core_mcp_contract_router.py \
            agvm_api/core_license_router.py \
            agvm_api/module_manifest_contracts.py \
            agvm_api/module_hardening.py \
            agvm_mcp_server/server.py \
            scripts/agvm_module_supervisor.py

      - name: Install UI dependencies
        working-directory: agvm_cockpit_prototype
        run: npm ci

      - name: Build public core UI
        working-directory: agvm_cockpit_prototype
        run: npm run build
        env:
          VITE_AGVM_UI_SHELL_PROFILE: public_core
          VITE_API_URL: http://localhost:8010

      - name: Validate Docker Compose
        run: docker compose config

      - name: Validate SPDX and REUSE coverage
        run: python -m reuse lint

      - name: Run public contract tests
        run: python -m pytest -q

      - name: Scan the exported source boundary
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          source = Path.cwd()
          target = Path(os.environ["RUNNER_TEMP"]) / "agvm-public-self-scan"
          shutil.rmtree(target, ignore_errors=True)
          shutil.copytree(
              source,
              target,
              ignore=shutil.ignore_patterns(".git", "node_modules", "dist", "__pycache__", ".pytest_cache"),
          )
          PY
          python scripts/check_public_export.py \
            --path "$RUNNER_TEMP/agvm-public-self-scan" \
            --denylist repo-policy/private-denylist.txt \
            --release \
            --scanner-mode docker

      - name: Scan committed content for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan committed content with TruffleHog
        run: |
          if ! docker run --rm \
            -v "$PWD:/src:ro" \
            trufflesecurity/trufflehog:3.95.6 \
            filesystem /src --json --no-update --fail \
            >"$RUNNER_TEMP/trufflehog.jsonl"; then
            echo "TruffleHog detected secret material; output is withheld from CI logs." >&2
            exit 1
          fi

      - name: Build and smoke Docker Core
        run: |
          docker compose build
          docker compose up -d agvm_core_api agvm_core_ui
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8010/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:3020/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Stop Docker Core
        if: always()
        run: docker compose down --volumes --remove-orphans
