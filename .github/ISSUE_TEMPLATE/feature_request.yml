name: Feature request
description: Propose a Core runtime, local UI, MCP or documentation improvement.
title: "[Feature]: "
labels: ["enhancement", "public-core"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What Core user workflow is blocked or awkward?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you want.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Local runtime
        - Local UI
        - MCP bridge
        - Documentation
        - Tests
        - Other public Core surface
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Public/private boundary
      description: Explain why this belongs in public Core rather than Detwin Cloud or paid modules.
