version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/agvm_cockpit_prototype"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "public-core"

  - package-ecosystem: "pip"
    directory: "/agvm_api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "public-core"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
