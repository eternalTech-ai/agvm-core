services:
  agvm_core_api:
    build:
      context: .
      dockerfile: agvm_api/Dockerfile.core
    environment:
      AGVM_EDITION: core
      AGVM_LAB_DATA_DIR: /app/data
      AGVM_BRAINS_DIR: /app/brains
      AGVM_DEFAULT_BRAIN_ID: ${AGVM_DEFAULT_BRAIN_ID:-default_brain}
      AGVM_ALLOW_SETUP_WITHOUT_PROVIDER: ${AGVM_ALLOW_SETUP_WITHOUT_PROVIDER:-true}
      AGVM_LLM_ENABLED: ${AGVM_LLM_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGVM_LLM_MODEL: ${AGVM_LLM_MODEL:-gpt-4o-mini}
      AGVM_COMPILER_MODEL: ${AGVM_COMPILER_MODEL:-gpt-4o-mini}
      AGVM_RETRIEVAL_MODEL: ${AGVM_RETRIEVAL_MODEL:-gpt-4o-mini}
      AGVM_ANSWER_MODEL: ${AGVM_ANSWER_MODEL:-gpt-4o-mini}
      AGVM_SLEEP_MODEL: ${AGVM_SLEEP_MODEL:-gpt-4o-mini}
      AGVM_GROW_PREVIEW_BINDING_SECRET: ${AGVM_GROW_PREVIEW_BINDING_SECRET:-}
      AGVM_LOCAL_LICENSE_SIGNING_SECRET: ${AGVM_LOCAL_LICENSE_SIGNING_SECRET:-}
      AGVM_ALLOW_DEV_LICENSE_FIXTURE: ${AGVM_ALLOW_DEV_LICENSE_FIXTURE:-false}
    ports:
      - "127.0.0.1:${AGVM_API_PORT:-8010}:8010"
    volumes:
      - agvm_core_data:/app/data
      - agvm_core_brains:/app/brains
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  agvm_core_ui:
    build:
      context: .
      dockerfile: agvm_cockpit_prototype/Dockerfile.core
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:${AGVM_API_PORT:-8010}}
        VITE_AGVM_UI_SHELL_PROFILE: public_core
        VITE_PLATFORM_URL: ${VITE_PLATFORM_URL:-https://app.detwin.ai}
    depends_on:
      agvm_core_api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AGVM_UI_PORT:-3020}:3020"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3020/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  agvm_mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    profiles:
      - mcp
    environment:
      AGVM_API_BASE_URL: http://agvm_core_api:8010
      AGVM_MCP_BRAIN_POLICY: ${AGVM_MCP_BRAIN_POLICY:-ai_create_if_missing}
      AGVM_MCP_BRAIN_ID: ${AGVM_MCP_BRAIN_ID:-}
      AGVM_MCP_BRAIN_ID_HINT: ${AGVM_MCP_BRAIN_ID_HINT:-}
      AGVM_MCP_BRAIN_DISPLAY_NAME: ${AGVM_MCP_BRAIN_DISPLAY_NAME:-AI Client Memory}
      AGVM_MCP_BRAIN_PURPOSE: ${AGVM_MCP_BRAIN_PURPOSE:-Persistent MCP memory for this AI client.}
      AGVM_MCP_READ_ONLY: ${AGVM_MCP_READ_ONLY:-false}
      AGVM_MCP_TIMEOUT_SECONDS: ${AGVM_MCP_TIMEOUT_SECONDS:-180}
      AGVM_MCP_MODULE_VISIBILITY_POLICY: ${AGVM_MCP_MODULE_VISIBILITY_POLICY:-block_unlicensed}
      AGVM_HOSTED_MCP_URL: ${AGVM_HOSTED_MCP_URL:-https://mcp.detwin.ai}
      AGVM_HOSTED_MCP_API_KEY: ${AGVM_HOSTED_MCP_API_KEY:-}
    depends_on:
      agvm_core_api:
        condition: service_healthy
    stdin_open: true
    tty: false
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  agvm_core_data:
  agvm_core_brains:
